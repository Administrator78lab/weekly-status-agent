<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Status Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px;
           margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
    button { font-size: 1rem; padding: .5rem 1rem; margin-right: .5rem;
             cursor: pointer; border-radius: 6px; border: 1px solid #ccc; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 6px;
          white-space: pre-wrap; word-break: break-all; }
    #who { color: #0a7d28; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Weekly Status Agent</h1>

  <p>
    <button id="signInBtn">Sign in</button>
    <button id="signOutBtn" hidden>Sign out</button>
    <span id="who"></span>
  </p>

  <p><button id="tokenBtn" hidden>Get Work IQ token</button></p>

  <p>
    <input id="q" value="What meetings do I have this week?"
           style="width:60%;padding:.4rem;font-size:1rem">
    <button id="askBtn" hidden>Ask Work IQ</button>
  </p>

  <p id="agentRow" hidden>
    <label style="font-size:.9rem">Agent id:
      <input id="agent" value="bizchat-as-gpt-scenario"
             style="width:340px;padding:.3rem;font-family:monospace">
    </label>
    <button id="listBtn">List agents</button>
  </p>

  <hr>

  <h3 style="font-size:1rem;margin-bottom:.3rem">MCP (Model Context Protocol)</h3>
  <p id="mcpRow" hidden>
    <button id="mcpInitBtn">1. Initialize</button>
    <button id="mcpToolsBtn">2. List tools</button>
    <button id="mcpAskBtn">3. Call ask tool</button>
    <button id="mcpFetchBtn">4. Fetch emails (no LLM)</button>
  </p>

  <pre id="out"></pre>

  <!-- Libraries first: msal defines the global `msal`, config.js defines CONFIG,
       auth.js uses both. The inline script below depends on all three. -->
  <script src="msal-browser.min.js"></script>
  <script src="config.js"></script>
  <!-- Optional local overrides with real tenant values. Gitignored.
       onerror keeps the page working when the file is absent. -->
  <script src="config.local.js" onerror="void 0"></script>
  <script src="auth.js"></script>
  <script src="workiq.js"></script>
  <script src="workiq-mcp.js"></script>

  <script>
    const $ = id => document.getElementById(id);
    const log = obj => $("out").textContent =
      typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);

    // Decode a JWT payload. Base64url -> base64 -> JSON.
    function decodeJwt(token) {
      const payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(atob(payload));
    }

    function render(account) {
      const signedIn = !!account;
      $("signInBtn").hidden = signedIn;
      $("signOutBtn").hidden = !signedIn;
      $("tokenBtn").hidden = !signedIn;
      $("askBtn").hidden = !signedIn;
      $("agentRow").hidden = !signedIn;
      $("mcpRow").hidden = !signedIn;
      $("who").textContent = signedIn ? `Signed in as ${account.username}` : "";
    }

    $("signInBtn").onclick = async () => {
      try { render(await signIn()); }
      catch (e) { log("Sign-in failed: " + e.message); }
    };

    $("signOutBtn").onclick = async () => { await signOut(); render(null); log(""); };

    $("tokenBtn").onclick = async () => {
      try {
        const token = await getWorkIqToken();
        const claims = decodeJwt(token);
        log({
          audience: claims.aud,
          scopes: claims.scp,
          tenant: claims.tid,
          user: claims.upn || claims.preferred_username,
          expires: new Date(claims.exp * 1000).toLocaleString(),
          tokenPreview: token.slice(0, 40) + "..."
        });
      } catch (e) { log("Token failed: " + e.message); }
    };

    $("askBtn").onclick = async () => {
      log("Asking Work IQ...");
      try {
        const r = await askWorkIq($("q").value, null, $("agent").value.trim());
        log((r.text || "(empty answer)") + "\n\n--- request-id: " + r.requestId);
      } catch (e) { log(e.message); }
    };

    $("listBtn").onclick = async () => {
      log("Listing agents...");
      try { log(await listWorkIqAgents()); }
      catch (e) { log(e.message); }
    };

    $("mcpInitBtn").onclick = async () => {
      log("MCP initialize...");
      try {
        const r = await mcpInitialize();
        log("MCP INITIALIZE OK\n\nsession: " + r.sessionId +
            "\nrequest-id: " + r.requestId +
            "\n\n" + JSON.stringify(r.result, null, 2));
      } catch (e) { log("MCP initialize failed:\n\n" + e.message); }
    };

    $("mcpToolsBtn").onclick = async () => {
      log("MCP tools/list...");
      try {
        const r = await mcpListTools();
        log("TOOLS (" + r.tools.length + ")\n\n" +
            r.tools.map(t => `- ${t.name}: ${t.description ?? ""}`).join("\n") +
            "\n\n" + JSON.stringify(r.tools, null, 2));
      } catch (e) { log("MCP tools/list failed:\n\n" + e.message); }
    };

    $("mcpAskBtn").onclick = async () => {
      log("MCP tools/call ...");
      try {
        // Send only the required parameter first. Optional ones (agentId,
        // timeZone) are added back once the minimal call is known to work.
        const r = await mcpCallTool("ask", { question: $("q").value });
        log((r.text || JSON.stringify(r.raw, null, 2)) +
            "\n\n--- request-id: " + r.requestId);
      } catch (e) { log("MCP tools/call failed:\n\n" + e.message); }
    };

    $("mcpFetchBtn").onclick = async () => {
      log("MCP fetch /me/messages ...");
      try {
        const r = await mcpCallTool("fetch", {
          entityUrls: ["/me/messages?$select=subject,from,receivedDateTime&$top=10"],
        });
        log((r.text || JSON.stringify(r.raw, null, 2)) +
            "\n\n--- request-id: " + r.requestId);
      } catch (e) { log("MCP fetch failed:\n\n" + e.message); }
    };

    initAuth().then(render).catch(e => log("Init failed: " + e.message));
  </script>
</body>
</html>
